# dsh-collab bundle patch
#
# 1) Host 行：会话级协作房间 + 中继客户端，挂到既有 webServer 的 /dsh-collab 上。
# 2) preset-collab：「协作模式」。
#    这里只声明**最基础、跨版本都在**的插件行——任何一行缺失都会让整个 preset
#    注册失败、模式列表里直接看不到「协作模式」。所以刻意去掉了 tool-cordis、
#    plugin-manager、子代理/工作流组等可选依赖。
- insert:
    - id: collab-host
      name: 'dsh-collab'

    - id: preset-collab
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: collab
        name: 协作模式
        description: "多人协作：这个会话有自己的房间，队友加入同一房间号才能互相看到进度与成果；各自的问答只留在本机。"
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你在「协作模式」里工作：这个会话是团队客厅里的一间房，队友正看着这里的进度与成果。

                - 每完成一个阶段，用一两句话写清「做了什么 / 得到什么 / 下一步」，队友才看得懂。
                - 长内容落成文件并在回复里给出绝对路径，房间里的成果区会显示这些文件。
                - 先看房间里已有的结论与产物，不要重复劳动；结论冲突时以磁盘文件为准。
                - 你们的对话各自私有，只有进度摘要和交付的文件是共享的。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
